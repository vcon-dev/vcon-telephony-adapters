# Example Compose file for running an adapter in Docker.
#
# Copy to compose.yaml, copy .env.example to .env and fill it in, then:
#   docker compose up twilio
#
# Each service runs the same image with a different adapter name as its
# command (see Dockerfile CMD). Uncomment the adapters you need.
services:
  twilio:
    build: .
    image: vcon-telephony-adapters:local
    command: ["twilio"]
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped

