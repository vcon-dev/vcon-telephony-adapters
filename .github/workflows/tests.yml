name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Note: the vcon package requires Python 3.12+
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,s3]"

      - name: Run tests with coverage
        run: |
          pytest --cov=core --cov=adapters --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  tenant-contract:
    # Runs vcon-mcp's own tenant extractor and lawful basis reader on the vCons the Telnyx
    # adapter posts (tests/adapters/telnyx/test_tenant_contract.py, skipped in the job above).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out vcon-mcp
        uses: actions/checkout@v4
        with:
          repository: vcon-dev/vcon-mcp
          # Pinned on purpose. Bump this SHA deliberately, after reading what changed in
          # src/config/tenant-config.ts and src/utils/lawful-basis.ts, and never to a branch
          # name.
          ref: b1091435466a0e10f6822bdd9d98ce343bbd9caf
          path: vcon-mcp

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vcon-mcp dependencies
        working-directory: vcon-mcp
        run: npm ci

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the contract test
        env:
          VCON_MCP_DIR: ${{ github.workspace }}/vcon-mcp
        run: pytest --no-cov tests/adapters/telnyx/test_tenant_contract.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.1.0" "black>=24.0.0"

      - name: Check formatting with Black
        run: black --check .

      - name: Lint with Ruff
        run: ruff check .
